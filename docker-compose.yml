version: "3.9"

# NOTE IMPORTANTE (environnement de ce lab) : le démon Docker ne partage PAS le
# système de fichiers de l'hôte tel que vu depuis code-server — un bind mount à
# chemin RELATIF (ex. ./backend:/app) se résout différemment selon l'endroit
# d'où `docker compose` est invoqué, et peut monter un dossier vide côté
# démon (le code de l'image se retrouve alors masqué, pas juste "pas mis à
# jour"). Le code est donc BAKÉ dans l'image (COPY dans le Dockerfile) ; le
# seul bind mount qui reste ici (/mnt/dev, /mnt/ports) utilise ${HOST_DEV_ROOT}
# — un chemin ABSOLU propagé par reset_url.sh — précisément pour rester correct
# quel que soit l'endroit d'où ce fichier est déployé (voir .env.example
# racine). Toute modif de code nécessite un rebuild (recompose_docker --force).

networks:
  sso-net:
    external: true
    name: sso-lab_sso-net
  dev-net:
    external: true
    name: dev-net
  lab-admin-net:
    # Réseau interne privé : backend/worker <-> redis (lancement des tests E2E).
    driver: bridge

services:

  redis:
    image: redis:7-alpine
    container_name: lab-admin-redis
    restart: unless-stopped
    networks:
      - lab-admin-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: lab-admin-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8083:8000"
    networks:
      - sso-net
      - dev-net
      - lab-admin-net
    volumes:
      # Registre des ports + .keycloak-client-opts de chaque app — non secrets
      # (le code ne doit JAMAIS lire un .env d'app depuis /mnt/dev, seulement
      # .keycloak-client-opts ; voir api/infrastructure.py et api/lab_groups.py).
      - ${HOST_DEV_ROOT}/.ports:/mnt/ports:ro
      - ${HOST_DEV_ROOT}:/mnt/dev:ro
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/lab-admin-api/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 8000}}"

  worker:
    build: ./backend
    container_name: lab-admin-worker
    restart: unless-stopped
    env_file: .env
    # Un seul test E2E à la fois : cohérent avec le mutex du runner
    # (runner/server.js) et la contrainte 2 vCPU/16 Go (cf. CLAUDE.md).
    command: celery -A config worker --loglevel=info --concurrency=1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sso-net   # pour atteindre lab-runner (réseau sso-net)
      - dev-net   # pour écrire dans devdb (schéma lab_admin)
      - lab-admin-net

  frontend:
    build: ./frontend
    container_name: lab-admin-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "4201:80"
    networks:
      - sso-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/lab-admin/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
